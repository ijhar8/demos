<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V33 Fitness Studio — AI Assistant Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .page-note { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; padding: 10px 20px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); font-size: 13px; color: #666; }
  #chat-launcher { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: #0a7cff; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(10,124,255,.4); display: flex; align-items: center; justify-content: center; transition: transform .2s; z-index: 1000; }
  #chat-launcher:hover { transform: scale(1.08); }
  #chat-launcher svg { width: 28px; height: 28px; fill: #fff; }
  #chat-window { position: fixed; bottom: 100px; right: 24px; width: 380px; max-width: calc(100vw - 32px); height: 540px; max-height: calc(100vh - 140px); background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.16); display: none; flex-direction: column; overflow: hidden; z-index: 1000; }
  #chat-window.open { display: flex; }
  .chat-header { background: #0a7cff; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .chat-header .avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .chat-header .info h3 { font-size: 15px; font-weight: 600; }
  .chat-header .info p { font-size: 12px; opacity: .85; }
  .chat-header .info p::before { content: '● '; color: #7dffb0; }
  .chat-body { flex: 1; overflow-y: auto; padding: 16px; background: #f9fafb; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; margin-bottom: 10px; white-space: pre-line; }
  .msg.bot { background: #fff; border: 1px solid #e8eaed; border-bottom-left-radius: 4px; }
  .msg.user { background: #0a7cff; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .quick-replies button { background: #fff; border: 1px solid #d5dae1; border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: #0a7cff; transition: all .15s; }
  .quick-replies button:hover { background: #0a7cff; color: #fff; border-color: #0a7cff; }
  .typing { display: flex; gap: 4px; padding: 12px 16px; background: #fff; border: 1px solid #e8eaed; border-radius: 14px; border-bottom-left-radius: 4px; width: fit-content; margin-bottom: 10px; }
  .typing span { width: 7px; height: 7px; background: #b6bec9; border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  .chat-footer { padding: 12px 16px; background: #fff; border-top: 1px solid #e8eaed; display: flex; gap: 10px; }
  .chat-footer input { flex: 1; border: 1px solid #d5dae1; border-radius: 999px; padding: 10px 16px; font-size: 14px; outline: none; }
  .chat-footer input:focus { border-color: #0a7cff; }
  .chat-footer button { width: 42px; height: 42px; border-radius: 50%; background: #0a7cff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .chat-footer button svg { width: 18px; height: 18px; fill: #fff; }
  .branding { text-align: center; font-size: 11px; color: #9aa3af; padding: 6px 0 8px; background: #fff; }
</style>
</head>
<body>
<div class="page-note">Demo: this widget would sit on your website. Click the blue button →</div>

<button id="chat-launcher" onclick="toggleChat()" aria-label="Open chat">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
</button>

<div id="chat-window">
  <div class="chat-header">
    <div class="avatar" id="biz-avatar">S</div>
    <div class="info">
      <h3 id="biz-name">Serenity Salon</h3>
      <p>Online now — replies instantly</p>
    </div>
  </div>
  <div class="chat-body" id="chat-body"></div>
  <div class="chat-footer">
    <input id="chat-input" type="text" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="branding">Powered by AI assistant — 24/7</div>
</div>

<script>
// ============ CUSTOMIZE PER CLIENT (only this block changes) ============
const CONFIG = {
  "businessName": "V33 Fitness Studio",
  "greeting": "Hi! 👋 I'm the V33 Fitness Studio assistant. I can help you book a free trial, check timings or reach the team. What do you need?",
  "quickReplies": [
    "Book a free trial",
    "Membership prices",
    "Timings",
    "Where are you?"
  ],
  "knowledge": [
    {
      "keywords": [
        "book",
        "trial",
        "join",
        "appointment",
        "session",
        "slot",
        "free"
      ],
      "answer": "Awesome! Tell me your name and preferred time, and I'll have the team confirm your trial slot. You can also call us on 098923 52877 — we'll sort you out the same day."
    },
    {
      "keywords": [
        "price",
        "cost",
        "fee",
        "membership",
        "plan",
        "charge"
      ],
      "answer": "Memberships are tailored to your goals — monthly and quarterly options available. Share your number or call 098923 52877 and the team will send the exact plans and current offers."
    },
    {
      "keywords": [
        "hour",
        "timing",
        "open",
        "close",
        "schedule",
        "batch",
        "class"
      ],
      "answer": "Class timings vary by day — the team will confirm today's schedule when you call 098923 52877. Morning and evening batches are usually available."
    },
    {
      "keywords": [
        "where",
        "address",
        "location",
        "direction",
        "reach"
      ],
      "answer": "We're in Andheri West, Mumbai. Call 098923 52877 and the team will share the exact address and directions."
    },
    {
      "keywords": [
        "trainer",
        "coach",
        "personal training",
        "pt"
      ],
      "answer": "Yes — personal training and group sessions are available. Call 098923 52877 to discuss your goals with a coach."
    },
    {
      "keywords": [
        "human",
        "person",
        "speak",
        "call",
        "owner",
        "manager"
      ],
      "answer": "You can reach the team on 098923 52877 during working hours. I've also noted your question so they can follow up."
    }
  ],
  "fallback": "Good question — I've noted it for the team. For anything urgent, call 098923 52877. Meanwhile I can help with trials, memberships, timings or directions. 🙂"
};
// =======================================================================

const body = document.getElementById('chat-body');
document.getElementById('biz-name').textContent = CONFIG.businessName;
document.getElementById('biz-avatar').textContent = CONFIG.businessName.charAt(0);

let opened = false;
function toggleChat() {
  document.getElementById('chat-window').classList.toggle('open');
  if (!opened) { opened = true; botSay(CONFIG.greeting, CONFIG.quickReplies); }
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function addQuickReplies(options) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  options.forEach(opt => {
    const b = document.createElement('button');
    b.textContent = opt;
    b.onclick = () => { wrap.remove(); userSay(opt); };
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
  body.scrollTop = body.scrollHeight;
}

function userSay(text) { addMsg(text, 'user'); respond(text); }

function respond(text) {
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(t);
  body.scrollTop = body.scrollHeight;
  const q = text.toLowerCase();
  const hit = CONFIG.knowledge.find(k => k.keywords.some(kw => q.includes(kw.toLowerCase())));
  setTimeout(() => {
    t.remove();
    addMsg(hit ? hit.answer : CONFIG.fallback, 'bot');
  }, 700 + Math.random() * 600);
}

function botSay(text, quick) {
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(t);
  setTimeout(() => {
    t.remove();
    addMsg(text, 'bot');
    if (quick && quick.length) addQuickReplies(quick);
  }, 900);
}

function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  userSay(text);
}
</script>
</body>
</html>
